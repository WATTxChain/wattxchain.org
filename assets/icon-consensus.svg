<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none">
  <!-- Outer ring (PoW) -->
  <circle cx="48" cy="48" r="38" fill="none" stroke="#E8D44D" stroke-width="3" stroke-dasharray="8 4" opacity="0.6"/>
  <!-- Inner ring (PoS) -->
  <circle cx="48" cy="48" r="26" fill="none" stroke="#E8D44D" stroke-width="3" opacity="0.8"/>
  <!-- Center hub -->
  <circle cx="48" cy="48" r="12" fill="#E8D44D" opacity="0.2" stroke="#E8D44D" stroke-width="3"/>
  <!-- PoW pickaxe (top-left) -->
  <line x1="20" y1="24" x2="34" y2="38" stroke="#E8D44D" stroke-width="3" stroke-linecap="round"/>
  <path d="M16 20L24 16L28 24" fill="#E8D44D" opacity="0.6" stroke="#E8D44D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- PoS coin (bottom-right) -->
  <circle cx="72" cy="70" r="9" fill="#E8D44D" opacity="0.25" stroke="#E8D44D" stroke-width="2.5"/>
  <text x="72" y="74" font-family="monospace" font-size="11" fill="#E8D44D" text-anchor="middle" font-weight="bold">S</text>
  <!-- Merge arrows -->
  <line x1="72" y1="26" x2="58" y2="38" stroke="#E8D44D" stroke-width="2.5" stroke-linecap="round"/>
  <polyline points="62,34 58,38 63,39" fill="none" stroke="#E8D44D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="24" y1="70" x2="38" y2="58" stroke="#E8D44D" stroke-width="2.5" stroke-linecap="round"/>
  <polyline points="34,62 38,58 33,57" fill="none" stroke="#E8D44D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Center hybrid symbol -->
  <text x="48" y="53" font-family="monospace" font-size="13" fill="#E8D44D" text-anchor="middle" font-weight="bold">H</text>
</svg>
