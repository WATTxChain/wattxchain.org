<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!-- Outer ring (PoW) -->
  <circle cx="48" cy="48" r="38" fill="none" stroke="#E8D44D" stroke-width="2" stroke-dasharray="8 4" opacity="0.5"/>
  <!-- Inner ring (PoS) -->
  <circle cx="48" cy="48" r="26" fill="none" stroke="#E8D44D" stroke-width="2" opacity="0.7"/>
  <!-- Center hub -->
  <circle cx="48" cy="48" r="10" fill="#161B22" stroke="#E8D44D" stroke-width="2.5"/>
  <!-- PoW pickaxe (top-left) -->
  <line x1="22" y1="26" x2="34" y2="38" stroke="#E8D44D" stroke-width="2" stroke-linecap="round"/>
  <path d="M18 22L26 18L30 26" fill="none" stroke="#E8D44D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- PoS coin (bottom-right) -->
  <circle cx="70" cy="68" r="8" fill="#161B22" stroke="#E8D44D" stroke-width="2"/>
  <text x="70" y="72" font-family="monospace" font-size="9" fill="#E8D44D" text-anchor="middle" opacity="0.8">S</text>
  <!-- Merge arrows (AuxPoW) -->
  <line x1="70" y1="28" x2="58" y2="38" stroke="#E8D44D" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <polyline points="62,34 58,38 63,39" fill="none" stroke="#E8D44D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <line x1="26" y1="68" x2="38" y2="58" stroke="#E8D44D" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <polyline points="34,62 38,58 33,57" fill="none" stroke="#E8D44D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <!-- Center hybrid symbol -->
  <text x="48" y="52" font-family="monospace" font-size="10" fill="#E8D44D" text-anchor="middle" opacity="0.9">H</text>
</svg>
