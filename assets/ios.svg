  <!-- WATTx logo hint on screen -->
  <circle cx="48" cy="46" r="10" fill="none" stroke="#E8D44D" stroke-width="1.5" opacity="0.4"/>
  <text x="48" y="50" font-family="monospace" font-size="9" fill="#E8D44D" text-anchor="middle" opacity="0.5">W</text>
