<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!-- Phone body -->
  <rect x="24" y="6" width="48" height="84" rx="10" fill="#161B22" stroke="#E8D44D" stroke-width="2"/>
  <!-- Screen -->
  <rect x="28" y="18" width="40" height="56" rx="2" fill="#0D1117" stroke="#E8D44D" stroke-width="1" opacity="0.6"/>
  <!-- Notch -->
  <rect x="38" y="8" width="20" height="6" rx="3" fill="#0D1117" stroke="#E8D44D" stroke-width="1" opacity="0.5"/>
  <!-- Home indicator -->
