<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Block 1 (back-left) -->
  <rect x="8" y="32" width="30" height="30" rx="4" fill="#E8D44D" opacity="0.3"/>
  <rect x="8" y="32" width="30" height="30" rx="4" fill="none" stroke="#E8D44D" stroke-width="2.5"/>
  <text x="23" y="51" font-family="monospace" font-size="11" font-weight="bold" fill="#E8D44D" text-anchor="middle" dominant-baseline="middle">#1</text>

  <!-- Chain link 1 -->
  <line x1="38" y1="47" x2="48" y2="41" stroke="#E8D44D" stroke-width="2.5" stroke-dasharray="4 3" opacity="0.8"/>

  <!-- Block 2 (center) -->
  <rect x="33" y="18" width="30" height="30" rx="4" fill="#E8D44D" opacity="0.35"/>
  <rect x="33" y="18" width="30" height="30" rx="4" fill="none" stroke="#E8D44D" stroke-width="2.5"/>
  <text x="48" y="37" font-family="monospace" font-size="11" font-weight="bold" fill="#E8D44D" text-anchor="middle" dominant-baseline="middle">#2</text>

  <!-- Chain link 2 -->
  <line x1="63" y1="33" x2="73" y2="27" stroke="#E8D44D" stroke-width="2.5" stroke-dasharray="4 3" opacity="0.8"/>

  <!-- Block 3 (front-right, highlighted) -->
  <rect x="58" y="8" width="30" height="30" rx="4" fill="#E8D44D" opacity="0.2"/>
  <rect x="58" y="8" width="30" height="30" rx="4" fill="none" stroke="#E8D44D" stroke-width="3"/>
  <text x="73" y="27" font-family="monospace" font-size="11" font-weight="bold" fill="#E8D44D" text-anchor="middle" dominant-baseline="middle">#3</text>

  <!-- Magnifying glass -->
  <circle cx="62" cy="68" r="16" fill="none" stroke="#E8D44D" stroke-width="3"/>
  <circle cx="62" cy="68" r="10" fill="#E8D44D" opacity="0.15"/>
  <line x1="74" y1="80" x2="86" y2="92" stroke="#E8D44D" stroke-width="4" stroke-linecap="round"/>
</svg>
