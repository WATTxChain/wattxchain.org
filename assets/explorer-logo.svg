<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!-- Block 1 (back-left) -->
  <rect x="8" y="24" width="32" height="32" rx="4" fill="#161B22" stroke="#E8D44D" stroke-width="2"/>
  <text x="24" y="44" font-family="monospace" font-size="10" fill="#E8D44D" text-anchor="middle" dominant-baseline="middle">#1</text>

  <!-- Chain link 1 -->
  <line x1="40" y1="40" x2="48" y2="36" stroke="#E8D44D" stroke-width="2" stroke-dasharray="2 2" opacity="0.6"/>

  <!-- Block 2 (center) -->
  <rect x="32" y="12" width="32" height="32" rx="4" fill="#161B22" stroke="#E8D44D" stroke-width="2.5"/>
  <text x="48" y="32" font-family="monospace" font-size="10" fill="#E8D44D" text-anchor="middle" dominant-baseline="middle">#2</text>

  <!-- Chain link 2 -->
  <line x1="64" y1="28" x2="72" y2="24" stroke="#E8D44D" stroke-width="2" stroke-dasharray="2 2" opacity="0.6"/>

  <!-- Block 3 (front-right, highlighted) -->
  <rect x="56" y="8" width="32" height="32" rx="4" fill="#1C2230" stroke="#E8D44D" stroke-width="2"/>
  <text x="72" y="28" font-family="monospace" font-size="10" fill="#E8D44D" text-anchor="middle" dominant-baseline="middle">#3</text>

  <!-- Search/scan overlay circle (bottom-right) -->
  <circle cx="68" cy="68" r="18" fill="none" stroke="#E8D44D" stroke-width="2.5" opacity="0.8"/>
  <circle cx="68" cy="68" r="14" fill="none" stroke="#E8D44D" stroke-width="1" opacity="0.3" stroke-dasharray="3 2"/>
  <!-- Crosshair -->
  <line x1="68" y1="56" x2="68" y2="80" stroke="#E8D44D" stroke-width="1" opacity="0.4"/>
  <line x1="56" y1="68" x2="80" y2="68" stroke="#E8D44D" stroke-width="1" opacity="0.4"/>
  <!-- Scan dot -->
  <circle cx="68" cy="68" r="3" fill="#E8D44D" opacity="0.7"/>

  <!-- Connecting line from blocks to scanner -->
  <line x1="48" y1="44" x2="56" y2="56" stroke="#E8D44D" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.35"/>
</svg>
